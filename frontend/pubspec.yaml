name: libraryflow
description: Ứng dụng quản lý thư viện cho độc giả và thủ thư.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.0
  fl_chart: ^1.1.1
  flutter_secure_storage: ^10.0.0
  intl: any
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/team.json
